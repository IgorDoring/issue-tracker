<div class="login-wrapper">
  <form #loginForm="ngForm" class="login" (ngSubmit)="onSubmit(loginForm)">
    <section class="title">
      <h3 class="welcome">Welcome to</h3>
      Issue Tracker
    </section>
    <div class="login-group">
      <clr-input-container>
        <label class="clr-sr-only">Username</label>
        <input
          type="text"
          autocomplete="username"
          name="username"
          clrInput
          placeholder="Username"
          [(ngModel)]="username"
        />
      </clr-input-container>
      <clr-password-container>
        <label class="clr-sr-only">Password</label>
        <input
          type="password"
          autocomplete="current-password"
          name="password"
          clrPassword
          placeholder="Password"
          [(ngModel)]="password"
        />
      </clr-password-container>
      <div *ngIf="hasError" class="error active">Invalid user name or password</div>

      <button type="submit" class="btn btn-primary">Login</button>
    </div>
  </form>
</div>
